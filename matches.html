<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koralytics - Create Match</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #05080f;
      color: #e2e8f0;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.05), transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.05), transparent 25%);
    }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .form-input {
      width: 100%;
      background-color: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(51, 65, 85, 0.8);
      color: #f1f5f9;
      border-radius: 0.75rem;
      padding: 0.75rem 1.25rem;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 1px #0ea5e9;
      background-color: rgba(30, 41, 59, 0.9);
    }

    /* Customizing date picker icon for dark theme */
    ::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
    
    select option {
      background-color: #0f172a;
      color: #e2e8f0;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8" x-data="createActualMatchApp()">

  <div class="max-w-5xl w-full glass-card rounded-3xl p-8 sm:p-10 relative overflow-hidden">
    
    <!-- Background Accents -->
    <div class="absolute -top-32 -right-32 w-80 h-80 bg-blue-600 rounded-full mix-blend-screen filter blur-[100px] opacity-20 pointer-events-none"></div>
    <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-purple-600 rounded-full mix-blend-screen filter blur-[100px] opacity-20 pointer-events-none"></div>

    <!-- Header -->
    <div class="mb-8 relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-6 gap-6">
      <div>
        <div class="inline-flex items-center gap-2 mb-2">
          <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
          <span class="text-xs font-bold text-blue-400 tracking-widest uppercase">Match Execution</span>
        </div>
        <h2 class="text-3xl font-black uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">
          Initialize Match
        </h2>
        <p class="text-slate-400 text-sm mt-1">Convert a planned fixture into an active match record.</p>
      </div>

      <!-- Load From Fixture Dropdown -->
      <div class="w-full md:w-72 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Load Data From Fixture</label>
        <select x-model="selectedFixtureId" @change="loadFixtureData" class="form-input text-sm py-2">
          <option value="">-- Create Standalone Match --</option>
          <template x-for="fixture in pendingFixtures" :key="fixture.id">
            <option :value="fixture.id" x-text="fixture.name"></option>
          </template>
        </select>
      </div>
    </div>

    <!-- Form Section -->
    <form @submit.prevent="submitForm" class="relative z-10 space-y-8">
      
      <!-- Teams VS Section -->
      <div class="flex flex-col md:flex-row items-center justify-between gap-6 bg-slate-900/30 p-6 rounded-2xl border border-slate-800 shadow-inner relative">
        <!-- Home Team -->
        <div class="w-full md:w-5/12 flex flex-col">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Home Team</label>
          <select x-model="formData.homeTeamId" required class="form-input text-center text-lg font-bold" :class="{'opacity-75 cursor-not-allowed': selectedFixtureId}" :disabled="selectedFixtureId !== ''">
            <option value="" disabled>Select Home</option>
            <template x-for="team in teams" :key="team.id">
              <option :value="team.id" x-text="team.name"></option>
            </template>
          </select>
        </div>

        <!-- VS Badge -->
        <div class="flex-shrink-0">
          <div class="w-12 h-12 rounded-full bg-slate-950 border border-slate-700 flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.2)]">
            <span class="text-sm font-black italic text-slate-300">VS</span>
          </div>
        </div>

        <!-- Away Team -->
        <div class="w-full md:w-5/12 flex flex-col">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1 text-right">Away Team</label>
          <select x-model="formData.awayTeamId" required class="form-input text-center text-lg font-bold" :class="{'opacity-75 cursor-not-allowed': selectedFixtureId}" :disabled="selectedFixtureId !== ''">
            <option value="" disabled>Select Away</option>
            <template x-for="team in teams" :key="team.id">
              <option :value="team.id" x-text="team.name"></option>
            </template>
          </select>
        </div>
      </div>

      <!-- Match Details Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        
        <div class="flex flex-col">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Match Type</label>
          <select x-model="formData.type" required class="form-input">
            <option value="0">Friendly</option>
            <option value="1">League</option>
            <option value="2">Cup</option>
            <option value="3">Tournament</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Format</label>
          <select x-model="formData.format" required class="form-input">
            <option value="11">11 v 11</option>
            <option value="9">9 v 9</option>
            <option value="7">7 v 7</option>
            <option value="5">5 v 5</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Date & Time</label>
          <input type="datetime-local" x-model="formData.matchDate" required class="form-input">
        </div>

        <div class="flex flex-col">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Location / Stadium</label>
          <input type="text" x-model="formData.location" placeholder="e.g. Camp Nou" required class="form-input">
        </div>
      </div>

      <!-- Formations & Links Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/20 p-6 rounded-2xl border border-slate-800">
        
        <!-- Formations -->
        <div class="space-y-4">
          <h3 class="text-sm font-bold text-slate-300 uppercase tracking-widest border-b border-slate-700 pb-2">Tactical Setup</h3>
          <div class="flex gap-4">
            <div class="w-1/2">
              <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Home Formation</label>
              <select x-model="formData.formation" class="form-input text-sm">
                <option value="">TBD</option>
                <option value="4-3-3">4-3-3</option>
                <option value="4-4-2">4-4-2</option>
                <option value="4-2-3-1">4-2-3-1</option>
                <option value="3-5-2">3-5-2</option>
              </select>
            </div>
            <div class="w-1/2">
              <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Away Formation</label>
              <select x-model="formData.awayFormation" class="form-input text-sm">
                <option value="">TBD</option>
                <option value="4-3-3">4-3-3</option>
                <option value="4-4-2">4-4-2</option>
                <option value="4-2-3-1">4-2-3-1</option>
                <option value="3-5-2">3-5-2</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Links -->
        <div class="space-y-4">
          <h3 class="text-sm font-bold text-slate-300 uppercase tracking-widest border-b border-slate-700 pb-2">Associations (Optional)</h3>
          <div class="flex gap-4">
            <div class="w-1/2">
              <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Tournament</label>
              <select x-model="formData.tournamentId" class="form-input text-sm" :class="{'opacity-75 cursor-not-allowed': selectedFixtureId && formData.tournamentId}" :disabled="selectedFixtureId !== '' && formData.tournamentId !== ''">
                <option value="">None</option>
                <option value="1">Champions League</option>
                <option value="2">Premier League</option>
              </select>
            </div>
            <div class="w-1/2">
              <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Drill Session</label>
              <select x-model="formData.sessionId" class="form-input text-sm">
                <option value="">None</option>
                <option value="1">Morning Tactics</option>
                <option value="2">Evening Scrimmage</option>
              </select>
            </div>
          </div>
        </div>

      </div>

      <!-- Submit Button -->
      <div class="pt-2 flex justify-end">
        <button type="submit" 
                class="group relative px-8 py-3 font-bold text-white rounded-xl bg-blue-600 overflow-hidden transition-all hover:scale-105 hover:shadow-[0_0_20px_rgba(37,99,235,0.4)]">
          <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-blue-500 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300 -z-10"></div>
          <div class="flex items-center gap-2 relative z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="tracking-wider uppercase text-sm">Create Match</span>
          </div>
        </button>
      </div>

    </form>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('createActualMatchApp', () => ({
        selectedFixtureId: '',
        
        formData: {
          homeTeamId: '',
          awayTeamId: '',
          tournamentId: '',
          sessionId: '',
          type: '1', // Default League
          format: '11', // Default 11v11
          matchDate: '',
          location: '',
          formation: '',
          awayFormation: ''
        },

        // Mock Data for Dropdowns
        teams: [
          { id: '1', name: 'Manchester City' },
          { id: '2', name: 'Real Madrid' },
          { id: '3', name: 'Bayern Munich' }
        ],

        pendingFixtures: [
          { id: '101', name: 'Fixture: Man City vs Real Madrid', homeTeamId: '1', awayTeamId: '2', tournamentId: '1' },
          { id: '102', name: 'Fixture: Bayern vs Man City', homeTeamId: '3', awayTeamId: '1', tournamentId: '1' }
        ],

        // Automatically fill data when a fixture is selected
        loadFixtureData() {
          if (this.selectedFixtureId) {
            const fixture = this.pendingFixtures.find(f => f.id === this.selectedFixtureId);
            if (fixture) {
              this.formData.homeTeamId = fixture.homeTeamId;
              this.formData.awayTeamId = fixture.awayTeamId;
              this.formData.tournamentId = fixture.tournamentId;
              this.formData.type = '3'; // Assuming Fixture means Tournament type
            }
          } else {
            // Reset if deselected
            this.formData.homeTeamId = '';
            this.formData.awayTeamId = '';
            this.formData.tournamentId = '';
          }
        },

        submitForm() {
          // Payload mapping exactly to your C# Match entity
          const payload = {
            homeTeamId: parseInt(this.formData.homeTeamId),
            awayTeamId: parseInt(this.formData.awayTeamId),
            tournamentId: this.formData.tournamentId ? parseInt(this.formData.tournamentId) : null,
            sessionId: this.formData.sessionId ? parseInt(this.formData.sessionId) : null,
            type: parseInt(this.formData.type), // Enum
            format: parseInt(this.formData.format), // Enum
            matchDate: new Date(this.formData.matchDate).toISOString(),
            location: this.formData.location,
            formation: this.formData.formation || null,
            awayFormation: this.formData.awayFormation || null,
            
            // Backend Defaults (Usually set in C# directly, but explicitly showing they start at 0/null)
            status: 0, // MatchStatus.NotStarted
            homeScore: 0,
            awayScore: 0,
            homePenaltyScore: null,
            awayPenaltyScore: null,
            winningTeamId: null
          };

          // If created from a fixture, you'd typically send the FixtureId to the backend 
          // so the backend can update the Fixture.MatchId = newMatch.Id
          if (this.selectedFixtureId) {
            payload.linkedFixtureId = parseInt(this.selectedFixtureId);
          }

          console.log('Sending Match Entity:', payload);
          alert('Match created successfully! Check console for C# DTO payload.');
        }
      }))
    })
  </script>
</body>
</html>
