<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koralytics - Post-Match Analysis</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            koralime: '#ccff00',
            koradark: '#090b10',
            koracard: '#121620',
            koraborder: '#1f2533'
          },
          fontFamily: {
            teko: ['Teko', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090b10;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      /* Subtle pitch outline in background + glowing gradients */
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(204, 255, 0, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M100,50 L900,50 L900,550 L100,550 Z' fill='none' stroke='rgba(255,255,255,0.02)' stroke-width='2'/%3E%3Cpath d='M500,50 L500,550' fill='none' stroke='rgba(255,255,255,0.02)' stroke-width='2'/%3E%3Ccircle cx='500' cy='300' r='70' fill='none' stroke='rgba(255,255,255,0.02)' stroke-width='2'/%3E%3C/svg%3E");
      background-attachment: fixed;
      background-size: cover;
    }

    .kora-card {
      background-color: #121620;
      border: 1px solid #1f2533;
      border-radius: 1rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    
    .text-outline {
      -webkit-text-stroke: 1px rgba(255,255,255,0.1);
      color: transparent;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8" x-data="postMatchAnalysisApp()">

  <!-- Top Navbar Mockup (Matching the image) -->
  <header class="max-w-6xl mx-auto flex justify-between items-center mb-12 relative z-10">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 border-2 border-koralime flex items-center justify-center">
        <span class="text-koralime text-xs font-bold font-teko">K</span>
      </div>
      <h1 class="text-xl font-bold tracking-widest uppercase font-teko flex flex-col leading-none">
        <span class="text-white">Koralytics</span>
        <span class="text-[8px] text-gray-500 tracking-[0.2em]">Data. Performance. Future.</span>
      </h1>
    </div>
    <nav class="hidden md:flex gap-6 text-sm text-gray-400">
      <a href="#" class="hover:text-white transition">my profile</a>
      <a href="#" class="hover:text-white transition">home</a>
      <a href="#" class="hover:text-white transition">about</a>
      <a href="#" class="hover:text-white transition">clubs</a>
      <a href="#" class="hover:text-white transition">contact</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto relative z-10">
    
    <!-- Section Header -->
    <div class="mb-8">
      <div class="inline-flex items-center gap-2 mb-2">
        <span class="w-2 h-2 rounded-full bg-koralime"></span>
        <span class="text-xs font-bold text-koralime tracking-widest uppercase">Post-Match Report</span>
      </div>
      <div class="flex justify-between items-end">
        <h2 class="text-4xl sm:text-5xl font-bold uppercase tracking-wide font-teko text-white" x-text="analysisData.teamName + ' ANALYSIS'">
        </h2>
        <div class="px-4 py-1 border border-koralime/30 rounded-full text-koralime text-xs uppercase tracking-widest bg-koralime/5">
          Season Overview
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Left Column: Aggregated Stats -->
      <div class="lg:col-span-1 space-y-6">
        
        <!-- Win/Draw/Loss Card -->
        <div class="kora-card p-6 relative overflow-hidden">
          <div class="absolute -right-4 -bottom-4 text-8xl font-teko text-outline opacity-20 pointer-events-none">FORM</div>
          <h3 class="text-xs text-gray-400 font-bold tracking-widest uppercase mb-4">Overall Record</h3>
          
          <div class="flex justify-between items-end mb-6">
            <div class="text-center">
              <div class="text-4xl font-teko text-koralime" x-text="analysisData.wins"></div>
              <div class="text-[10px] text-gray-500 uppercase tracking-widest">Wins</div>
            </div>
            <div class="text-center">
              <div class="text-4xl font-teko text-gray-400" x-text="analysisData.draws"></div>
              <div class="text-[10px] text-gray-500 uppercase tracking-widest">Draws</div>
            </div>
            <div class="text-center">
              <div class="text-4xl font-teko text-red-400" x-text="analysisData.losses"></div>
              <div class="text-[10px] text-gray-500 uppercase tracking-widest">Losses</div>
            </div>
          </div>

          <!-- Win Rate Bar -->
          <div class="h-2 w-full bg-koraborder rounded-full overflow-hidden flex">
            <div class="bg-koralime h-full" :style="'width: ' + getWinRate() + '%'"></div>
            <div class="bg-gray-500 h-full" :style="'width: ' + getDrawRate() + '%'"></div>
            <div class="bg-red-500 h-full" :style="'width: ' + getLossRate() + '%'"></div>
          </div>
        </div>

        <!-- Goals Card -->
        <div class="kora-card p-6">
          <h3 class="text-xs text-gray-400 font-bold tracking-widest uppercase mb-4">Goal Statistics</h3>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-koradark border border-koraborder rounded-lg p-4 flex flex-col items-center justify-center">
              <span class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Goals For</span>
              <span class="text-3xl font-teko text-white" x-text="analysisData.goalsFor"></span>
            </div>
            <div class="bg-koradark border border-koraborder rounded-lg p-4 flex flex-col items-center justify-center">
              <span class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Goals Against</span>
              <span class="text-3xl font-teko text-white" x-text="analysisData.goalsAgainst"></span>
            </div>
          </div>
          <div class="mt-4 bg-koradark border border-koraborder rounded-lg p-3 flex justify-between items-center">
            <span class="text-[10px] text-gray-400 uppercase tracking-widest">Goal Difference</span>
            <span class="text-xl font-teko" 
                  :class="getGoalDiff() > 0 ? 'text-koralime' : (getGoalDiff() < 0 ? 'text-red-400' : 'text-gray-400')"
                  x-text="(getGoalDiff() > 0 ? '+' : '') + getGoalDiff()"></span>
          </div>
        </div>
      </div>

      <!-- Right Column: Recent Matches (The 'Last 5' from the DTO) -->
      <div class="lg:col-span-2 kora-card p-6 sm:p-8">
        <div class="flex justify-between items-center border-b border-koraborder pb-4 mb-6">
          <h3 class="text-sm text-gray-300 font-bold tracking-widest uppercase">Recent Form (Last 5 Matches)</h3>
        </div>

        <div class="space-y-4">
          <template x-for="(match, index) in analysisData.recentMatches" :key="match.matchId">
            
            <!-- Match Row -->
            <div class="group flex flex-col sm:flex-row justify-between items-center bg-koradark/50 border border-transparent hover:border-koraborder rounded-xl p-4 transition-all duration-300">
              
              <!-- Date & Result Badge -->
              <div class="flex items-center gap-4 w-full sm:w-auto mb-4 sm:mb-0">
                <div class="w-8 h-8 rounded flex items-center justify-center font-bold text-sm"
                     :class="{
                       'bg-koralime text-black': match.result === 'W',
                       'bg-red-500 text-white': match.result === 'L',
                       'bg-gray-600 text-white': match.result === 'D'
                     }" x-text="match.result">
                </div>
                <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold" x-text="formatDate(match.matchDate)"></div>
              </div>

              <!-- Matchup VS -->
              <div class="flex-1 flex items-center justify-center gap-4 sm:gap-8 w-full">
                <div class="text-right flex-1 text-sm sm:text-base font-bold text-white truncate" x-text="analysisData.teamName"></div>
                
                <!-- Score Block -->
                <div class="shrink-0 bg-koraborder px-4 py-1.5 rounded text-lg font-teko tracking-wider flex items-center gap-2 shadow-inner">
                  <span :class="match.result === 'W' ? 'text-koralime' : 'text-white'" x-text="match.goalsFor"></span>
                  <span class="text-gray-500 text-sm">-</span>
                  <span :class="match.result === 'L' ? 'text-red-400' : 'text-white'" x-text="match.goalsAgainst"></span>
                </div>
                
                <div class="text-left flex-1 text-sm sm:text-base font-bold text-gray-400 truncate" x-text="match.opponentName"></div>
              </div>

            </div>
          </template>
          
          <!-- Empty State if no matches -->
          <div x-show="analysisData.recentMatches.length === 0" class="text-center py-8 text-gray-500 text-sm uppercase tracking-widest">
            No completed matches found for this team.
          </div>
        </div>

        <!-- Action Button (Matching the image's Schedule Match button style) -->
        <div class="mt-8 flex justify-end">
          <button class="bg-koralime hover:bg-[#b3e600] text-black font-bold text-sm uppercase tracking-widest py-3 px-8 rounded-lg transition-colors shadow-[0_0_15px_rgba(204,255,0,0.2)]">
            Download Full Report
          </button>
        </div>

      </div>
    </div>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('postMatchAnalysisApp', () => ({
        // This object maps exactly to your C# PostMatchAnalysisResponseDto
        analysisData: {
          teamId: 1,
          teamName: 'U17 TEAM A',
          wins: 3,
          losses: 1,
          draws: 1,
          goalsFor: 12,
          goalsAgainst: 5,
          recentMatches: [
            { matchId: 105, matchDate: '2026-07-28T18:00:00', opponentName: 'Zamalek Academy', result: 'W', goalsFor: 2, goalsAgainst: 0 },
            { matchId: 104, matchDate: '2026-07-21T16:00:00', opponentName: 'Wadi Degla', result: 'D', goalsFor: 1, goalsAgainst: 1 },
            { matchId: 103, matchDate: '2026-07-14T17:30:00', opponentName: 'Al Masry Academy', result: 'L', goalsFor: 1, goalsAgainst: 2 },
            { matchId: 102, matchDate: '2026-07-07T16:00:00', opponentName: 'Pyramids FC', result: 'W', goalsFor: 4, goalsAgainst: 1 },
            { matchId: 101, matchDate: '2026-06-30T15:00:00', opponentName: 'Smouha Club', result: 'W', goalsFor: 4, goalsAgainst: 1 }
          ]
        },

        // Helper calculations
        getTotalMatches() {
          return this.analysisData.wins + this.analysisData.draws + this.analysisData.losses;
        },
        getWinRate() {
          const total = this.getTotalMatches();
          return total === 0 ? 0 : (this.analysisData.wins / total) * 100;
        },
        getDrawRate() {
          const total = this.getTotalMatches();
          return total === 0 ? 0 : (this.analysisData.draws / total) * 100;
        },
        getLossRate() {
          const total = this.getTotalMatches();
          return total === 0 ? 0 : (this.analysisData.losses / total) * 100;
        },
        getGoalDiff() {
          return this.analysisData.goalsFor - this.analysisData.goalsAgainst;
        },
        formatDate(dateString) {
          const options = { month: 'short', day: 'numeric', year: 'numeric' };
          return new Date(dateString).toLocaleDateString('en-US', options);
        }
      }))
    })
  </script>
</body>
</html>
