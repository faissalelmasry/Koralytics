<div class="auth-card-content">
  <div class="header">
    <h2>{{ 'AUTH.RESET_PASSWORD.TITLE' | translate }}</h2>
    <p>{{ 'AUTH.RESET_PASSWORD.SUBTITLE' | translate }}</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
    
    <div class="password-container">
      <app-text-input
        [label]="'AUTH.RESET_PASSWORD.NEW_PASSWORD' | translate"
        type="password"
        formControlName="newPassword"
        [errorMessage]="passwordError ? (passwordError | translate) : ''">
      </app-text-input>
      <app-password-strength [password]="form.get('newPassword')?.value || ''"></app-password-strength>
    </div>

    <app-text-input
      [label]="'AUTH.RESET_PASSWORD.CONFIRM_NEW_PASSWORD' | translate"
      type="password"
      formControlName="confirmNewPassword"
      [errorMessage]="form.errors?.['mismatch'] && form.get('confirmNewPassword')?.touched ? ('AUTH.ERRORS.PASSWORDS_MISMATCH' | translate) : ''">
    </app-text-input>

    <app-button 
      type="submit" 
      variant="accent" 
      [loading]="isLoading" 
      class="full-width-btn">
      {{ 'AUTH.RESET_PASSWORD.RESET_BTN' | translate }}
    </app-button>
  </form>

  <div class="footer-text">
    <a routerLink="/auth/login" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      {{ 'AUTH.RESET_PASSWORD.BACK_TO_LOGIN' | translate }}
    </a>
  </div>
</div>
