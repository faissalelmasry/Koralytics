<div class="settings-container" scrollReveal direction="bottom">
  <div class="header" scrollReveal direction="bottom" [delay]="0">
    <h1>{{ 'AUTH.CHANGE_PASSWORD.TITLE' | translate }}</h1>
    <p>{{ 'AUTH.CHANGE_PASSWORD.SUBTITLE' | translate }}</p>
  </div>

  <div class="card" scrollReveal direction="bottom" [delay]="150">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="settings-form">
      
      <div class="form-row">
        <app-text-input
          [label]="'AUTH.CHANGE_PASSWORD.CURRENT_PASSWORD' | translate"
          type="password"
          formControlName="oldPassword"
          [errorMessage]="form.get('oldPassword')?.touched && form.get('oldPassword')?.invalid ? ('AUTH.ERRORS.REQUIRED' | translate) : ''">
        </app-text-input>
      </div>

      <div class="form-row password-container">
        <app-text-input
          [label]="'AUTH.CHANGE_PASSWORD.NEW_PASSWORD' | translate"
          type="password"
          formControlName="newPassword"
          [errorMessage]="newPasswordError ? (newPasswordError | translate) : ''">
        </app-text-input>
        <app-password-strength [password]="form.get('newPassword')?.value || ''"></app-password-strength>
      </div>

      <div class="form-row">
        <app-text-input
          [label]="'AUTH.CHANGE_PASSWORD.CONFIRM_NEW_PASSWORD' | translate"
          type="password"
          formControlName="confirmPassword"
          [errorMessage]="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched ? ('AUTH.ERRORS.PASSWORDS_MISMATCH' | translate) : ''">
        </app-text-input>
      </div>

      <div class="form-actions">
        <app-button 
          type="submit" 
          variant="accent" 
          [loading]="isLoading">
          {{ 'AUTH.CHANGE_PASSWORD.UPDATE_BTN' | translate }}
        </app-button>
      </div>

    </form>
  </div>
</div>
