<app-navbar></app-navbar>

<div class="profile-page">
  <!-- Loading State -->
  <div class="preloader-overlay" *ngIf="isLoading">
    <app-loading-spinner size="lg"></app-loading-spinner>
    <p>Loading system admin dashboard...</p>
  </div>

  <!-- Content Ready -->
  <ng-container *ngIf="!isLoading">
    <div class="profile-container">

      <!-- HEADER -->
      <div class="glass-card fade-in"
        style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
        <div>
          <h2
            style="margin: 0 0 8px 0; font-size: 1.8rem; font-weight: 600; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Platform Administration
          </h2>
          <p style="margin: 0; color: #94a3b8;">
            Global oversight of academies, user management, badges, and onboarding workflows
          </p>
        </div>

        <div class="user-profile" *ngIf="currentUser" style="display: flex; align-items: center; gap: 12px;">
          <div class="avatar"
            style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; font-size: 18px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);">
            {{ currentUser.fullName.charAt(0) || currentUser.email.charAt(0) || 'S' }}
          </div>
          <div class="profile-info" style="display: flex; flex-direction: column;">
            <span class="user-name" style="font-size: 1rem; font-weight: 600; color: #e2e8f0;">{{ currentUser.fullName
              || currentUser.userName }}</span>
            <span class="user-role" style="font-size: 0.8rem; color: #60a5fa; font-weight: 500;">System
              Administrator</span>
          </div>
        </div>
      </div>

      <!-- SECTIONS -->
      <app-pending-requests-section scrollReveal direction="bottom" [delay]="100"
        (requestsChanged)="refreshPendingCount()">
      </app-pending-requests-section>

      <app-active-academies-section scrollReveal direction="bottom" [delay]="200"></app-active-academies-section>

      <app-manage-badges-section scrollReveal direction="bottom" [delay]="300"></app-manage-badges-section>

      <app-manage-users-section scrollReveal direction="bottom" [delay]="400"></app-manage-users-section>

    </div>
  </ng-container>
</div>
