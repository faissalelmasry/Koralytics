<div
  class="mini-card-wrapper"
  [ngClass]="tierClass"
  [class.float-anim]="float"
  [style.--mpc-accent]="accentColor || null"
  (click)="onClick()"
>
  <div class="card-top-bar">
    <div class="stat-badge">
      <span class="overall-rating">{{ player.overallRating }}</span>
      <span class="position-code">{{ player.position }}</span>
    </div>
    <div class="mini-logo" [ngClass]="tierClass"></div>
  </div>

  <div class="player-avatar-box">
    @if (player.profileImageUrl) {
      <img [src]="player.profileImageUrl" [alt]="player.fullName" />
    } @else {
      <span class="player-initials">{{ getInitials(player.fullName) }}</span>
    }
  </div>

  <div class="player-name-box">
    <div class="player-fullname">{{ player.fullName }}</div>
  </div>
</div>
