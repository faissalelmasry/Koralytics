<div class="timeline-container">
  @for (event of events; track event.minute) {
    <div class="timeline-row">
      @if (event.side === 'home') {
        <div class="timeline-event-box home">
          <div class="event-details">
            <span class="event-type-badge" [style.color]="event.accentColor">{{ event.eventType }}</span>
            <span class="event-subtext">{{ event.eventSubtext }}</span>
          </div>
          <app-mini-player-card [player]="event.player" size="xs" />
        </div>
      } @else {
        <div class="timeline-event-box empty"></div>
      }

      <div class="minute-badge">{{ event.minute }}'</div>

      @if (event.side === 'away') {
        <div class="timeline-event-box away">
          <app-mini-player-card [player]="event.player" size="xs" />
          <div class="event-details">
            <span class="event-type-badge" [style.color]="event.accentColor">{{ event.eventType }}</span>
            <span class="event-subtext">{{ event.eventSubtext }}</span>
          </div>
        </div>
      } @else {
        <div class="timeline-event-box empty"></div>
      }
    </div>
  }
</div>
