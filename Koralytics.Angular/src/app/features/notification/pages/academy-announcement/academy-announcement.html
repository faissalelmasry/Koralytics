<app-navbar></app-navbar>

<div class="aa-page">

  <!-- =============== HERO BANNER =============== -->
  <div class="hero-banner" scrollReveal direction="bottom" [delay]="0">
    <div class="aa-identity">
      <div class="aa-icon-circle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 11 18-5v12L3 14v-3z"/>
          <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
        </svg>
      </div>
      <div>
        <h1>Academy Announcements</h1>
        <div class="meta-pills">
          <span class="pill gold">Broadcast Center</span>
        </div>
      </div>
    </div>
    <p class="header-sub">Broadcast updates to your teams, age groups, or specific roles</p>
  </div>

  <!-- =============== COMPOSE PANEL =============== -->
  <div class="aa-panel aa-compose-panel" scrollReveal direction="bottom" [delay]="100">
    <div class="panel-header">
      <span>New Announcement</span>
    </div>

    <form class="aa-form" [formGroup]="announcementForm" (ngSubmit)="onSendAnnouncement()">

      <app-text-input
        label="title"
        formControlName="title"
        [errorMessage]="titleError">
      </app-text-input>

      <div class="textarea-field-group" [class.has-error]="bodyError">
        <label class="textarea-label" for="aa-body">message body</label>
        <textarea
          id="aa-body"
          class="aa-textarea"
          rows="5"
          maxlength="1000"
          formControlName="body"
          placeholder="write the announcement message...">
        </textarea>
        <div class="textarea-footer">
          <span class="error-text-msg" *ngIf="bodyError">{{ bodyError }}</span>
          <span class="char-count">{{ announcementForm.get('body')?.value?.length || 0 }}/1000</span>
        </div>
      </div>

      <div class="aa-target-row">

        <app-select
          label="send to"
          [options]="targetTypeOptions()"
          [value]="selectedTargetType()"
          (valueChange)="onTargetTypeChange($event)">
        </app-select>

        <!-- Team picker: real dropdown fed by AcademyAnnouncementService.getTeams(),
             replacing the old raw numeric "team id" input. -->
        <app-select
          *ngIf="selectedTargetType() === AnnouncementTargetType.Team"
          label="team"
          [options]="teamOptions()"
          [value]="announcementForm.get('targetId')?.value"
          [errorMessage]="targetIdError"
          [disabled]="isLoadingTargetOptions()"
          (valueChange)="onTargetIdChange($event)">
        </app-select>

        <!-- Age group picker: same pattern, fed by getAgeGroups(). -->
        <app-select
          *ngIf="selectedTargetType() === AnnouncementTargetType.AgeGroup"
          label="age group"
          [options]="ageGroupOptions()"
          [value]="announcementForm.get('targetId')?.value"
          [errorMessage]="targetIdError"
          [disabled]="isLoadingTargetOptions()"
          (valueChange)="onTargetIdChange($event)">
        </app-select>

        <app-select
          *ngIf="selectedTargetType() === AnnouncementTargetType.Role"
          label="role"
          [options]="roleOptions"
          [value]="announcementForm.get('role')?.value"
          [errorMessage]="roleError"
          (valueChange)="onRoleChange($event)">
        </app-select>

      </div>

      <!-- Team/Age-group lookup failed to load -- surfaced separately from
           the target row itself so a fetch failure doesn't just make the
           dropdown silently look empty with no explanation. -->
      <div class="aa-banner aa-banner-error" *ngIf="targetOptionsError()">
        {{ targetOptionsError() }}
      </div>

      <!-- Feedback Banners -->
      <div class="aa-banner aa-banner-error" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>
      <div class="aa-banner aa-banner-success" *ngIf="successMessage()">
        {{ successMessage() }}
      </div>

      <div class="aa-form-actions">
        <app-button type="submit" variant="accent" [loading]="isSubmitting()">
          send announcement
        </app-button>
      </div>

    </form>
  </div>

  <!-- Sent Announcements History (Child Component) -->
  <div scrollReveal direction="bottom" [delay]="200">
    <app-announcement-history
      [announcements]="announcements()"
      [isLoading]="isLoading()"
      [academyId]="academyId()">
    </app-announcement-history>
  </div>

</div>

<app-footer scrollReveal direction="bottom" [delay]="200"></app-footer>
