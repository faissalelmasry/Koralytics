<div class="feature-lock-container" [class.is-locked]="isLocked" [class.is-button-mode]="mode === 'button'" [style.--lock-color]="requiredTier === 'Elite' ? '#06b6d4' : '#fbbf24'">
  <div class="feature-content" [class.blurred]="isLocked && mode === 'card'" [class.button-locked]="isLocked && mode === 'button'">
    <ng-content></ng-content>
  </div>
  
  @if (isLocked) {
    @if (mode === 'button') {
      <div class="button-lock-overlay" (click)="openModal($event)" [title]="'Upgrade to ' + requiredTier + ' to unlock ' + featureName">
        <span class="button-lock-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
      </div>
    } @else {
      <div class="lock-overlay">
        <div class="lock-card">
          <div class="lock-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h3 class="lock-title">Feature Locked</h3>
          <p class="lock-message">Upgrade to <strong class="tier-highlight">{{ requiredTier }}</strong> to unlock {{ featureName }}.</p>
          <app-button [variant]="requiredTier === 'Elite' ? 'cyan' : 'gold'" (click)="upgrade()" [shimmer]="true">Upgrade to {{ requiredTier }}</app-button>
        </div>
      </div>
    }
  }

  @if (showModal) {
    <div class="modal-backdrop" (click)="closeModal()">
      <div class="modal-card lock-card" (click)="$event.stopPropagation()">
        <button type="button" class="modal-close-btn" (click)="closeModal()" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <div class="lock-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h3 class="lock-title">Feature Locked</h3>
        <p class="lock-message">Upgrade to <strong class="tier-highlight">{{ requiredTier }}</strong> to unlock {{ featureName }}.</p>
        <app-button [variant]="requiredTier === 'Elite' ? 'cyan' : 'gold'" (click)="upgrade()" [shimmer]="true">
          Upgrade to {{ requiredTier }}
        </app-button>
      </div>
    </div>
  }
</div>
