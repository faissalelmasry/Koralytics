<div class="cyber-table-responsive-container">
  <table class="cyber-data-table">
    
    <!-- Table Header -->
    <thead>
      <tr>
        <th *ngFor="let col of columns">
          <span class="header-glitch-text">{{ col.label }}</span>
        </th>
      </tr>
    </thead>

    <!-- Table Body -->
    <tbody>
      <ng-container *ngFor="let row of data; let i = index">
        <tr [style.--animation-order]="i">
          <td *ngFor="let col of columns" [attr.data-label]="col.label">
            
            <!-- Case 1: Standard Text -->
            <ng-container *ngIf="!col.type || col.type === 'text'">
              <span class="cell-text">{{ row[col.key] }}</span>
            </ng-container>

            <!-- Case 2: Status/Type Badges -->
            <ng-container *ngIf="col.type === 'badge'">
              <span class="cyber-badge" [ngClass]="(row[col.key] || '').toString().toLowerCase()">
                {{ row[col.key] }}
              </span>
            </ng-container>

            <!-- Case 3: User Info -->
            <ng-container *ngIf="col.type === 'user'">
              <div class="user-info">
                <div class="avatar-small">{{ row[col.key]?.charAt(0) }}</div>
                <div class="user-details">
                  <span class="user-name">{{ row[col.key] }}</span>
                  <span class="user-email">{{ row['email'] }}</span>
                </div>
              </div>
            </ng-container>

            <!-- Case 4: Action Buttons -->
            <ng-container *ngIf="col.type === 'action'">
              <div class="table-actions-hub">
                <!-- Set Main Location Button -->
                <button class="action-icon-btn set-main-btn" *ngIf="row.showSetMain && !row.isMain" (click)="onAction(row, 'setMain')" title="Set as Main Location">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                  </svg>
                </button>
                <!-- Inspect / Analyze Button -->
                <button class="action-icon-btn analyze-btn" *ngIf="!row.hideAnalyze && !row.showSetMain" (click)="onAction(row, 'view')" title="Inspect Details / Analyze">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                  </svg>
                </button>
                <!-- Remove / Delete Button -->
                <button class="action-icon-btn delete-btn" *ngIf="!row.hideDelete" (click)="onAction(row, 'delete')" title="Remove / Revoke">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
                <!-- Expand Row Button -->
                <button class="action-icon-btn expand-btn" *ngIf="expandable" (click)="toggleRow(row)" title="Toggle Details">
                  <svg *ngIf="!isRowExpanded(row)" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 9l6 6 6-6"/>
                  </svg>
                  <svg *ngIf="isRowExpanded(row)" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 15l-6-6-6 6"/>
                  </svg>
                </button>
              </div>
            </ng-container>

          </td>
        </tr>
        
        <!-- Expanded Row Template -->
        <tr *ngIf="expandable && isRowExpanded(row)" class="expanded-row">
          <td [attr.colspan]="columns.length">
            <div class="expanded-row-content">
              <ng-container *ngTemplateOutlet="expandedRowTemplate; context: { $implicit: row }"></ng-container>
            </div>
          </td>
        </tr>
      </ng-container>
    </tbody>

  </table>
</div>
