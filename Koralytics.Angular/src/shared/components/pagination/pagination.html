<div class="cyber-pagination-container">
  
  <!-- Info Status Text -->
  <span class="pagination-meta">
    {{ 'COMMON.PAGINATION.SHOWING_PAGE' | translate }} <span class="highlight">{{ currentPage }}</span> {{ 'COMMON.PAGINATION.OF' | translate }} {{ totalPages }}
  </span>

  <!-- Navigation Control Buttons -->
  <div class="pagination-controls">
    
    <!-- Previous Arrow -->
    <button 
      class="btn-nav" 
      [disabled]="currentPage === 1" 
      (click)="goToPage(currentPage - 1)">
      &larr; {{ 'COMMON.PAGINATION.PREV' | translate }}
    </button>

    <!-- Page Numbers Loop -->
    <button 
      *ngFor="let page of pagesArray" 
      class="btn-page-num" 
      [class.active]="page === currentPage"
      (click)="goToPage(page)">
      {{ page }}
    </button>

    <!-- Next Arrow -->
    <button 
      class="btn-nav" 
      [disabled]="currentPage === totalPages" 
      (click)="goToPage(currentPage + 1)">
      {{ 'COMMON.PAGINATION.NEXT' | translate }} &rarr;
    </button>

  </div>

</div>
