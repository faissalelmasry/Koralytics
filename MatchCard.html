<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koralytics - Next-Gen Match Scoreboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080a0f;
      --card-bg: #11151f;
      --card-border: rgba(255, 255, 255, 0.08);

      /* STATUS COLORS */
      --status-scheduled: #38bdf8; /* أزرق */
      --status-completed: #82f768; /* أخضر */
      --status-inprogress: #facc15; /* أصفر */

      /* TYPE COLORS (NEW) */
      --type-tournament: #a855f7; /* بنفسجي/ذهبي */
      --type-session: #06b6d4;    /* Cyan */
      --type-friendly: #f97316;   /* برتقالي */

      --text-main: #ffffff;
      --text-muted: #8e9bb0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .scoreboard-list {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* MATCH CARD */
    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 150px 1fr 140px;
      align-items: center;
      position: relative;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .match-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    }

    /* OUT OF THE BOX: MOMENTUM GAUGE BOTTOM BAR */
    .match-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
    }

    .match-card.is-live::after {
      background: linear-gradient(90deg, transparent, var(--status-inprogress), transparent);
    }
    .match-card.is-completed::after {
      background: var(--status-completed);
      opacity: 0.4;
    }
    .match-card.is-scheduled::after {
      background: var(--status-scheduled);
      opacity: 0.2;
    }

    /* LEFT META & BADGES */
    .match-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
    }

    .badge-type {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* TYPE STYLES */
    .type-tournament {
      background: rgba(168, 85, 247, 0.15);
      color: var(--type-tournament);
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .type-session {
      background: rgba(6, 182, 212, 0.15);
      color: var(--type-session);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }
    .type-friendly {
      background: rgba(249, 115, 22, 0.15);
      color: var(--type-friendly);
      border: 1px solid rgba(249, 115, 22, 0.3);
    }

    .badge-format {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .location-text {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    /* CENTER TEAMS & SCORES */
    .match-center {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }

    .team {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team.home { justify-content: flex-end; text-align: right; }
    .team.away { justify-content: flex-start; text-align: left; }

    /* WINNER HIGHLIGHT */
    .team.winner {
      color: var(--status-completed);
      text-shadow: 0 0 10px rgba(130, 247, 104, 0.25);
    }

    .win-tag {
      font-size: 9px;
      font-weight: 800;
      background: rgba(130, 247, 104, 0.15);
      color: var(--status-completed);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 110px;
    }

    .main-score {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-main);
    }

    .vs-badge {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      letter-spacing: 1px;
    }

    .penalty-tag {
      font-size: 9px;
      font-weight: 800;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 3px;
    }

    .scheduled-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--status-scheduled);
      margin-top: 4px;
    }

    /* RIGHT STATUS */
    .match-status {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .status-in-progress { color: var(--status-inprogress); }
    .status-completed { color: var(--status-completed); }
    .status-scheduled { color: var(--status-scheduled); }

    /* PULSE ANIMATION */
    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--status-inprogress);
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(250, 204, 21, 0.7);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(250, 204, 21, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
    }

    .match-date {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="scoreboard-list">

    <!-- 1. TOURNAMENT - IN PROGRESS (أصفر) -->
    <div class="match-card is-live">
      <div class="match-meta">
        <span class="badge-type type-tournament">Tournament</span>
        <span class="badge-format">11 v 11</span>
        <span class="location-text">📍 Pitch A - Main</span>
      </div>

      <div class="match-center">
        <div class="team home">Eagles Academy</div>
        <div class="score-box">
          <div class="main-score" style="color: var(--status-inprogress);">2 - 1</div>
        </div>
        <div class="team away">Lions FC</div>
      </div>

      <div class="match-status">
        <div class="status-badge status-in-progress">
          <span class="pulse-dot"></span> IN PROGRESS
        </div>
        <div class="match-date">Live Now</div>
      </div>
    </div>

    <!-- 2. SESSION - COMPLETED (أخضر مع WIN Badge) -->
    <div class="match-card is-completed">
      <div class="match-meta">
        <span class="badge-type type-session">Session</span>
        <span class="badge-format">7 v 7</span>
        <span class="location-text">📍 Indoor Court 2</span>
      </div>

      <div class="match-center">
        <div class="team home winner">
          <span class="win-tag">WIN</span> Alpha Team
        </div>
        <div class="score-box">
          <div class="main-score">3 - 3</div>
          <div class="penalty-tag">PENS: 5 - 4</div>
        </div>
        <div class="team away">Bravo Squad</div>
      </div>

      <div class="match-status">
        <div class="status-badge status-completed">COMPLETED</div>
        <div class="match-date">23 Jul, 2026</div>
      </div>
    </div>

    <!-- 3. FRIENDLY - SCHEDULED (أزرق مع VS Badge) -->
    <div class="match-card is-scheduled">
      <div class="match-meta">
        <span class="badge-type type-friendly">Friendly</span>
        <span class="badge-format">5 v 5</span>
        <span class="location-text">📍 Mini Pitch B</span>
      </div>

      <div class="match-center">
        <div class="team home">Thunder FC</div>
        <div class="score-box">
          <div class="vs-badge">VS</div>
          <div class="scheduled-time">20:30</div>
        </div>
        <div class="team away">Strikers XI</div>
      </div>

      <div class="match-status">
        <div class="status-badge status-scheduled">SCHEDULED</div>
        <div class="match-date">Tomorrow</div>
      </div>
    </div>

  </div>

</body>
</html>
