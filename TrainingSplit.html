<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Training Split - Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Global Styles */
    html, body { margin: 0; padding: 0; width: 100%; background-color: #06080a; overflow-x: hidden; font-family: 'Inter', sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    .page-container { padding: 32px 24px; max-width: 1200px; margin: 0 auto; }
    .page-header { margin-bottom: 32px; text-align: center; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: #f2f3f5; margin: 0; letter-spacing: 1px; }
    .accent { color: #c8ff4d; }
    .page-subtitle { color: #8b909a; font-size: 15px; margin-top: 8px; }
    
    .glass-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: #f2f3f5; padding: 12px 16px; border-radius: 8px; outline: none; font-size: 14px; font-family: inherit; width: 100%; }
    .btn-primary { background: #c8ff4d; color: #0a0c0f; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; height: 44px; display: flex; align-items: center; justify-content: center; }
    
    .controls-card { background: rgba(20, 23, 28, 0.6); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 24px; backdrop-filter: blur(12px); display: flex; align-items: flex-end; gap: 20px; max-width: 600px; margin: 0 auto 40px; }
    .input-group { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; color: #8b909a; font-weight: 600; }
    
    .split-results { display: flex; flex-direction: column; gap: 24px; width: 100%; }
    .balance-meter-container { background: rgba(20, 23, 28, 0.6); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 20px 24px; }
    .balance-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .balance-header h3 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #f2f3f5; margin: 0; }
    .balance-status { font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 8px; text-transform: uppercase; }
    .balance-status.balanced { background: rgba(200, 255, 77, 0.15); color: #c8ff4d; border: 1px solid rgba(200, 255, 77, 0.3); }
    .balance-track { position: relative; height: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 6px; overflow: hidden; display: flex; margin-bottom: 8px; }
    .balance-marker { position: absolute; top: -4px; bottom: -4px; width: 4px; background: #fff; border-radius: 2px; box-shadow: 0 0 8px rgba(255, 255, 255, 0.8); left: 50%; transform: translateX(-50%); z-index: 2; }
    .team-a-fill { background: linear-gradient(90deg, rgba(200, 255, 77, 0.5), #c8ff4d); width: 50%; }
    .team-b-fill { background: linear-gradient(270deg, rgba(0, 188, 212, 0.5), #00bcd4); width: 50%; }
    .balance-labels { display: flex; justify-content: space-between; font-size: 11px; color: #8b909a; font-weight: 600; text-transform: uppercase; }
    .team-a-label { color: #c8ff4d; }
    .team-b-label { color: #00bcd4; }
    
    .teams-container { display: flex; gap: 40px; align-items: flex-start; position: relative; width: 100%; }
    .vs-divider { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: rgba(255, 255, 255, 0.1); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #06080a; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.05); }
    .team-column { flex: 1; background: rgba(20, 23, 28, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; overflow: hidden; }
    .team-a { border-top: 4px solid #c8ff4d; }
    .team-b { border-top: 4px solid #00bcd4; }
    .team-header { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(255, 255, 255, 0.02); }
    .team-title h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #f2f3f5; margin: 0; }
    .player-count { font-size: 12px; color: #8b909a; }
    .team-stats { text-align: right; }
    .stat-label { font-size: 11px; color: #8b909a; font-weight: 600; }
    .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 24px; line-height: 1; }
    .team-a .stat-value { color: #c8ff4d; }
    .team-b .stat-value { color: #00bcd4; }
    
    .player-list { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .player-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: rgba(255, 255, 255, 0.03); border-radius: 12px; }
    .player-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.05); }
    .avatar-initial { font-family: 'Bebas Neue', sans-serif; font-size: 18px; }
    .team-a .avatar-initial { color: #c8ff4d; }
    .team-b .avatar-initial { color: #00bcd4; }
    .player-details { flex: 1; display: flex; flex-direction: column; }
    .player-name { font-size: 15px; font-weight: 600; color: #f2f3f5; }
    .player-pos { font-size: 11px; color: #8b909a; text-transform: uppercase; }
    .player-rating { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: #f2f3f5; background: rgba(255, 255, 255, 0.05); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">Training <span class="accent">Split</span></h1>
      <p class="page-subtitle">Automatically divide your squad into balanced teams for training sessions.</p>
    </div>

    <div class="controls-card">
      <div class="input-group">
        <label for="sessionSelect">Select Training Session</label>
        <select id="sessionSelect" class="glass-input">
          <option>U18 Pro Team — Oct 12, 2026 (Tactical)</option>
        </select>
      </div>
      <button class="btn-primary">⚔️ Split Teams</button>
    </div>

    <div class="split-results">
      <div class="balance-meter-container">
        <div class="balance-header">
          <h3>Squad Balance</h3>
          <span class="balance-status balanced">✓ Δ 0.5 — Balanced</span>
        </div>
        <div class="balance-track">
          <div class="balance-marker" style="left: 50%;"></div>
          <div class="balance-fill team-a-fill"></div>
          <div class="balance-fill team-b-fill"></div>
        </div>
        <div class="balance-labels">
          <span class="team-a-label">Team A</span>
          <span class="center-label">Ideal Balance</span>
          <span class="team-b-label">Team B</span>
        </div>
      </div>
      
      <div class="teams-container">
        <div class="team-column team-a">
          <div class="team-header">
            <div class="team-title">
              <h2>Team A</h2>
              <span class="player-count">1 Players</span>
            </div>
            <div class="team-stats">
              <span class="stat-label">AVG Rating</span>
              <div class="stat-value">85.0</div>
            </div>
          </div>
          <div class="player-list">
            <div class="player-row">
              <div class="player-avatar"><span class="avatar-initial">J</span></div>
              <div class="player-details">
                <span class="player-name">John Doe</span>
                <span class="player-pos">ST</span>
              </div>
              <div class="player-rating">85</div>
            </div>
          </div>
        </div>

        <div class="vs-divider">VS</div>

        <div class="team-column team-b">
          <div class="team-header">
            <div class="team-title">
              <h2>Team B</h2>
              <span class="player-count">1 Players</span>
            </div>
            <div class="team-stats">
              <span class="stat-label">AVG Rating</span>
              <div class="stat-value">84.5</div>
            </div>
          </div>
          <div class="player-list">
            <div class="player-row">
              <div class="player-avatar"><span class="avatar-initial">M</span></div>
              <div class="player-details">
                <span class="player-name">Mike Smith</span>
                <span class="player-pos">CB</span>
              </div>
              <div class="player-rating">84</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
