<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Temporary Access - Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; background-color: #06080a; overflow-x: hidden; font-family: 'Inter', sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    
    .page-container { padding: 32px 24px; max-width: 1200px; margin: 0 auto; }
    .page-header { margin-bottom: 32px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: #f2f3f5; margin: 0; letter-spacing: 1px; }
    .accent { color: #c8ff4d; }
    .page-subtitle { color: #8b909a; font-size: 15px; margin-top: 8px; }
    .glass-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: #f2f3f5; padding: 12px 16px; border-radius: 8px; outline: none; font-size: 14px; font-family: inherit; width: 100%; }
    .btn-primary { background: #c8ff4d; color: #0a0c0f; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; height: 44px; display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 24px;}
    .btn-primary:hover { transform: translateY(-2px); background: #b5e645; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .form-group label { font-size: 12px; color: #8b909a; font-weight: 600; }
    .hint { font-size: 11px; color: rgba(255,255,255,0.3); font-style: italic; }

    .layout-grid { display: grid; grid-template-columns: 400px 1fr; gap: 32px; align-items: start; }
    .grant-form-card, .active-grants-card { background: rgba(20, 23, 28, 0.6); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 24px; backdrop-filter: blur(12px); animation: slideInCard 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
    .active-grants-card { animation-delay: 0.1s; }
    h3 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #f2f3f5; margin: 0 0 20px; }
    
    .grants-list { display: flex; flex-direction: column; gap: 12px; }
    .grant-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; transition: transform 0.2s, background 0.2s; animation: fadeSlideItem 0.4s ease backwards; }
    .grant-item:hover { background: rgba(255, 255, 255, 0.04); transform: translateX(4px); }
    .grant-info { display: flex; flex-direction: column; gap: 8px; }
    .grant-name { font-size: 16px; font-weight: 600; color: #f2f3f5; }
    .grant-meta { display: flex; align-items: center; gap: 12px; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .badge.level { background: rgba(255, 255, 255, 0.1); color: #8b909a; }
    .badge.level.full { background: rgba(0, 188, 212, 0.15); color: #00bcd4; border: 1px solid rgba(0, 188, 212, 0.3); }
    .expiry-text { font-size: 12px; color: #8b909a; }
    
    .btn-revoke { background: rgba(244, 67, 54, 0.1); color: #ef5350; border: 1px solid rgba(244, 67, 54, 0.2); padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-revoke:hover { background: #ef5350; color: #fff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(239, 83, 80, 0.2); }
    
    @media (max-width: 900px) { .layout-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">Temporary <span class="accent">Access</span></h1>
      <p class="page-subtitle">Grant assistant coaches or analysts temporary access to your squad data.</p>
    </div>

    <div class="layout-grid">
      
      <!-- Left: Grant Form -->
      <div class="grant-form-card">
        <h3>Grant New Access</h3>
        
        <div class="form-group">
          <label for="userId">User ID</label>
          <input type="number" id="userId" class="glass-input" placeholder="Enter Coach/Analyst ID">
          <span class="hint">In a real app, this would be a searchable dropdown.</span>
        </div>

        <div class="form-group">
          <label for="accessLevel">Access Level</label>
          <select id="accessLevel" class="glass-input">
            <option value="ReadOnly">Read Only</option>
            <option value="FullSquad">Full Squad (Edit Notes/Tactics)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="expiry">Expiry Date</label>
          <input type="date" id="expiry" class="glass-input">
        </div>

        <button class="btn-primary">Grant Access</button>
      </div>

      <!-- Right: Active Grants List -->
      <div class="active-grants-card">
        <h3>Active Grants</h3>
        
        <div class="grants-list">
          <div class="grant-item">
            <div class="grant-info">
              <span class="grant-name">Analyst Bob (ID: 405)</span>
              <div class="grant-meta">
                <span class="badge level">ReadOnly</span>
                <span class="expiry-text">Expires: Oct 15, 2026</span>
              </div>
            </div>
            <button class="btn-revoke" title="Revoke Access">Revoke</button>
          </div>
          
          <div class="grant-item">
            <div class="grant-info">
              <span class="grant-name">Assistant Manager Sarah (ID: 102)</span>
              <div class="grant-meta">
                <span class="badge level full">FullSquad</span>
                <span class="expiry-text">Expires: Nov 1, 2026</span>
              </div>
            </div>
            <button class="btn-revoke" title="Revoke Access">Revoke</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
