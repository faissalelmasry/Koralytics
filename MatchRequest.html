<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Match Requests - Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; background-color: #06080a; overflow-x: hidden; font-family: 'Inter', sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    
    .page-container { padding: 32px 24px; max-width: 1000px; margin: 0 auto; }
    .page-header { margin-bottom: 32px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: #f2f3f5; margin: 0; letter-spacing: 1px; }
    .accent { color: #c8ff4d; }
    .page-subtitle { color: #8b909a; font-size: 15px; margin-top: 8px; }
    .btn-primary { background: #c8ff4d; color: #0a0c0f; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; height: 44px; display: flex; align-items: center; justify-content: center; }
    .btn-outline-danger { background: transparent; border: 1px solid rgba(244, 67, 54, 0.3); color: #ef5350; padding: 12px 32px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .btn-outline-danger:hover { background: rgba(244, 67, 54, 0.1); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(244, 67, 54, 0.15); }
    
    .tabs-container { display: flex; gap: 12px; margin-bottom: 32px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 16px; }
    .tab-btn { position: relative; background: transparent; border: none; color: #8b909a; font-size: 16px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; cursor: pointer; padding: 8px 16px; border-radius: 8px; transition: all 0.3s; display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .tab-btn::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 0; height: 2px; background: #c8ff4d; transition: width 0.3s; }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.05); color: #f2f3f5; }
    .tab-btn.active { background: rgba(200, 255, 77, 0.1); color: #c8ff4d; }
    .tab-btn.active::after { width: 60%; }
    .tab-badge { background: #ef5350; color: #fff; font-size: 12px; font-family: sans-serif; font-weight: 700; padding: 2px 6px; border-radius: 10px; line-height: 1; }
    
    .request-list { display: flex; flex-direction: column; gap: 16px; }
    .request-card { background: rgba(20, 23, 28, 0.6); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 24px; backdrop-filter: blur(12px); transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; animation: slideInRequest 0.4s backwards; }
    @keyframes slideInRequest { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .request-card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
    
    .request-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 16px; }
    .request-teams { display: flex; align-items: center; gap: 16px; }
    .team-name { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #f2f3f5; }
    .my-team { color: #c8ff4d; }
    .vs { font-size: 14px; color: #8b909a; font-style: italic; font-weight: 600; }
    
    .status-badge { padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: rgba(255, 152, 0, 0.15); color: #ffa726; border: 1px solid rgba(255, 152, 0, 0.3); }
    
    .request-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .detail-item { display: flex; align-items: center; gap: 8px; color: #f2f3f5; font-size: 14px; }
    .detail-icon { font-size: 16px; }
    .request-actions { display: flex; gap: 12px; }
    .request-actions button { flex: 1; max-width: 200px; }
    
    @media (max-width: 768px) { .request-teams { flex-direction: column; align-items: flex-start; gap: 8px; } }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">Match <span class="accent">Requests</span></h1>
      <p class="page-subtitle">Schedule friendly matches with other academies and manage incoming invitations.</p>
    </div>

    <div class="tabs-container">
      <button class="tab-btn active">Incoming Requests <span class="tab-badge">1</span></button>
      <button class="tab-btn">Sent Requests</button>
      <button class="tab-btn">+ Propose Match</button>
    </div>

    <div class="tab-content">
      <div class="request-list">
        <div class="request-card">
          <div class="request-header">
            <div class="request-teams">
              <span class="team-name">City FC Academy</span>
              <span class="vs">vs</span>
              <span class="team-name my-team">Your Team</span>
            </div>
            <span class="status-badge status-pending">Pending</span>
          </div>
          
          <div class="request-details">
            <div class="detail-item"><span class="detail-icon">📅</span><span>Oct 20, 2026, 6:00 PM</span></div>
            <div class="detail-item"><span class="detail-icon">📍</span><span>City Training Ground</span></div>
            <div class="detail-item"><span class="detail-icon">⚽</span><span>11v11</span></div>
            <div class="detail-item"><span class="detail-icon">👤</span><span>Coach: Marcus T.</span></div>
          </div>

          <div class="request-actions">
            <button class="btn-primary">Accept</button>
            <button class="btn-outline-danger">Decline</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
