<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Player Highlights - Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; background-color: #06080a; overflow-x: hidden; font-family: 'Inter', sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    
    .page-container { padding: 32px 24px; max-width: 1400px; margin: 0 auto; }
    .page-header { margin-bottom: 32px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: #f2f3f5; margin: 0; letter-spacing: 1px; }
    .accent { color: #c8ff4d; }
    .page-subtitle { color: #8b909a; font-size: 15px; margin-top: 8px; }
    .glass-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: #f2f3f5; padding: 12px 16px; border-radius: 8px; outline: none; font-size: 14px; font-family: inherit; width: 100%; }
    .btn-primary { background: #c8ff4d; color: #0a0c0f; border: none; padding: 12px 32px; border-radius: 8px; font-weight: 700; cursor: pointer; height: 44px; display: flex; align-items: center; justify-content: center; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 12px; color: #8b909a; font-weight: 600; }
    
    .upload-section { background: rgba(20, 23, 28, 0.6); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 24px; backdrop-filter: blur(12px); margin-bottom: 40px; }
    .upload-section h3 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #f2f3f5; margin: 0 0 20px; }
    .upload-form { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
    .flex-1 { flex: 1; min-width: 250px; }
    .file-input-wrapper { position: relative; background: rgba(0, 0, 0, 0.2); border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 12px 16px; width: 100%; min-width: 200px; cursor: pointer; display: flex; align-items: center; transition: border-color 0.2s; }
    .file-input-wrapper:hover { border-color: #c8ff4d; background: rgba(200, 255, 77, 0.05); }
    .file-name { font-size: 14px; color: #f2f3f5; }
    
    .gallery-section h3 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #f2f3f5; margin: 0 0 24px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .video-card { background: rgba(20, 23, 28, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; animation: scaleUpCard 0.5s backwards; }
    @keyframes scaleUpCard { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .video-card:hover { transform: translateY(-6px); border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
    .video-card.pinned { border-color: #c8ff4d; box-shadow: 0 4px 20px rgba(200, 255, 77, 0.15); }
    
    .video-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
    .video-wrapper video { width: 100%; height: 100%; object-fit: contain; }
    .pinned-badge { position: absolute; top: 12px; right: 12px; background: #c8ff4d; color: #0a0c0f; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    
    .video-info { padding: 16px 20px; flex: 1; }
    .video-info h4 { font-size: 16px; color: #f2f3f5; margin: 0 0 8px; line-height: 1.4; }
    .upload-date { font-size: 12px; color: #8b909a; }
    
    .video-actions { display: flex; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .btn-action { flex: 1; background: transparent; border: none; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-action.pin { color: #f2f3f5; border-right: 1px solid rgba(255, 255, 255, 0.05); }
    .btn-action.pin:hover:not(:disabled) { background: rgba(255, 255, 255, 0.05); }
    .btn-action.delete { color: #ef5350; }
    .btn-action.delete:hover { background: rgba(244, 67, 54, 0.1); }
    
    @media (max-width: 768px) { .upload-form { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">Player <span class="accent">Highlights</span></h1>
      <p class="page-subtitle">Manage and showcase top moments stored in the cloud.</p>
    </div>

    <!-- Upload Section -->
    <div class="upload-section">
      <h3>Upload New Highlight</h3>
      <div class="upload-form">
        <div class="form-group flex-1">
          <label for="highlightTitle">Highlight Title</label>
          <input type="text" id="highlightTitle" class="glass-input" placeholder="e.g. Great free kick against City FC">
        </div>
        
        <div class="form-group">
          <label for="highlightFile">Video File (MP4, MOV)</label>
          <div class="file-input-wrapper">
            <span class="file-name">Choose file...</span>
          </div>
        </div>
        
        <button class="btn-primary">Upload</button>
      </div>
    </div>

    <!-- Gallery Section -->
    <div class="gallery-section">
      <h3>Highlight Gallery</h3>

      <div class="video-grid">
        <div class="video-card pinned">
          <div class="video-wrapper">
            <video src="#" controls></video>
            <div class="pinned-badge">⭐ Pinned</div>
          </div>
          <div class="video-info">
            <h4>Bicycle Kick against Rivals</h4>
            <span class="upload-date">Sep 28, 2026</span>
          </div>
          <div class="video-actions">
            <button class="btn-action pin" disabled>Pinned</button>
            <button class="btn-action delete">Delete</button>
          </div>
        </div>

        <div class="video-card">
          <div class="video-wrapper">
            <video src="#" controls></video>
          </div>
          <div class="video-info">
            <h4>Solo Run and Assist</h4>
            <span class="upload-date">Oct 5, 2026</span>
          </div>
          <div class="video-actions">
            <button class="btn-action pin">Pin to Top</button>
            <button class="btn-action delete">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
